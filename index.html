document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"ab2dbfdf-26c9-44cc-99ad-dae074ad242f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n/* ---------- 1. tokens ---------- */\n:root{\n  --sky-brand:#00A1D8;\n  --sky-brand-text:#007FAB;\n  --sky-brand-press:#00648A;\n  --sky-white:#FFFFFF;\n  --sky-ink:#062430;\n  --sky-fill:#CCECF7;\n  --sky-fill-soft:#EBF7FC;\n\n  --glow-rest:0 0 12px rgba(255,255,255,.25);\n  --glow-hover:0 0 18px rgba(255,255,255,.40), 0 4px 12px rgba(0,0,0,.18);\n\n  --radius:2px;\n  --border:2px;\n\n  --dur-fast:140ms;\n  --dur-base:160ms;\n  --dur-slow:180ms;\n  --ease:cubic-bezier(0,0,.2,1);\n\n  --col:60rem;\n  --measure:44rem;\n  --pad-x:1.25rem;\n  --font-display:\"Luckiest Guy\",Impact,\"Arial Narrow\",sans-serif;\n  --font-body:\"Poppins\",system-ui,-apple-system,\"Helvetica Neue\",Helvetica,sans-serif;\n  --font-mono:ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n}\n\n/* ---------- 2. reset ---------- */\n*,*::before,*::after{box-sizing:border-box}\nhtml,body{margin:0;padding:0;overflow-x:hidden}\nhtml{scrollbar-width:none;-ms-overflow-style:none}\nhtml::-webkit-scrollbar,body::-webkit-scrollbar{display:none}\nbutton,input{font:inherit;color:inherit}\nul{margin:0;padding:0;list-style:none}\nsvg{display:block}\n\n/* ---------- 3. base ---------- */\nbody{\n  background:var(--sky-brand);\n  color:var(--sky-ink);\n  font-family:var(--font-body);\n  font-size:1rem;\n  line-height:1.6;\n  -webkit-font-smoothing:antialiased;\n  text-wrap:pretty;\n}\nh1,h2,h3{margin:0}\n.sky-h1,.sky-h2{font-family:var(--font-display);font-weight:400;line-height:1.22;letter-spacing:.01em}\np{margin:0}\na{color:var(--sky-ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;transition:color var(--dur-base) var(--ease)}\na:hover{color:var(--sky-brand-press)}\n.sky-card a:hover{color:var(--sky-brand-text)}\n.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}\n\n/* ---------- 4. layout ---------- */\n.sky-page{position:relative;min-height:100vh;overflow:hidden}\n.sky-wrap{width:100%;max-width:min(var(--col),100%);margin-inline:auto;padding-inline:var(--pad-x);position:relative;z-index:1}\n.sky-header{position:static;padding-block:1.25rem 0}\n.sky-main{display:block}\n.sky-sec{padding-block:4rem}\n.sky-hero{padding-block:2.5rem 2rem}\n.sky-footer{padding-block:2.5rem 3rem}\n\n/* decorative clouds */\n.sky-deco{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}\n.sky-deco svg{position:absolute;fill:var(--sky-white)}\n.sky-deco .d1{top:6rem;left:-6rem;width:26rem;opacity:.10}\n.sky-deco .d2{top:34rem;right:-9rem;width:34rem;opacity:.07}\n.sky-deco .d3{top:74rem;left:-4rem;width:22rem;opacity:.05}\n.sky-deco .d4{top:112rem;right:-5rem;width:28rem;opacity:.04}\n.sky-deco .d5{top:1rem;right:-16rem;width:38rem;opacity:.08}\n.sky-deco .d6{top:96rem;left:-12rem;width:32rem;opacity:.06}\n.sky-deco .d7{top:150rem;right:-10rem;width:20rem;opacity:.10}\n.sky-drift{animation:sky-drift 190s linear infinite alternate}\n.sky-drift-b{animation:sky-drift 240s linear infinite alternate-reverse}\n@keyframes sky-drift{from{transform:translateX(-1.5rem)}to{transform:translateX(1.5rem)}}\n\n/* ---------- 5. components ---------- */\n/* logo */\n.sky-logo{display:inline-flex;align-items:center;cursor:pointer}\n.sky-logo img{display:block;width:4.125rem;height:4.125rem;border-radius:var(--radius)}\n.sky-mark{font-family:var(--font-display);font-weight:400;font-size:1.5rem;line-height:1.22;letter-spacing:.01em;color:var(--sky-white);transform:scaleX(.93);transform-origin:left center}\n\n/* hero */\n.sky-h1{font-size:2rem;color:var(--sky-white);overflow-wrap:break-word;text-wrap:balance}\n.sky-lede{margin-top:1rem;font-size:1.0625rem;max-width:var(--measure)}\n.sky-privacy{margin-top:1.25rem;display:inline-flex;align-items:center;gap:.5rem;background:var(--sky-white);color:var(--sky-ink);padding:.5rem .75rem;border-radius:var(--radius);font-weight:600;font-size:.9375rem;box-shadow:var(--glow-rest)}\n.sky-privacy .sky-warn-icon{position:relative;flex:none;width:1rem;height:1rem;background:var(--sky-brand-text);clip-path:polygon(50% 0%,100% 100%,0% 100%)}\n.sky-privacy .sky-warn-icon::before{content:\"\";position:absolute;left:50%;top:38%;width:2px;height:32%;background:var(--sky-white);transform:translateX(-50%)}\n.sky-privacy .sky-warn-icon::after{content:\"\";position:absolute;left:50%;bottom:14%;width:2px;height:2px;background:var(--sky-white);transform:translateX(-50%)}\n\n/* drop zone — single flat-bottomed cloud path, no per-shape borders/shadows */\n.sky-zone{position:relative;display:block;width:100%;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}\n.sky-zone-frame{display:block;position:relative;width:100%;max-width:100%;margin-inline:auto;margin-top:1.5rem}\n.sky-zone-svg{display:block;width:100%;height:auto;filter:drop-shadow(0 0 12px rgba(255,255,255,.25));transition:filter var(--dur-base) var(--ease),transform var(--dur-base) var(--ease)}\n.sky-zone-path{fill:var(--sky-white);stroke:var(--sky-white);stroke-width:5px;vector-effect:non-scaling-stroke;transition:fill var(--dur-base) var(--ease),stroke-opacity var(--dur-base) var(--ease)}\n.sky-zone-inner{position:absolute;left:14%;right:14%;top:48%;bottom:6%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.25rem;text-align:center;z-index:1}\n.sky-zone-title{font-family:var(--font-body);font-weight:600;font-size:1rem;color:var(--sky-ink);letter-spacing:-.01em;line-height:1.3}\n.sky-zone-sub{font-size:.8125rem;line-height:1.4;color:var(--sky-ink)}\n.sky-zone:hover .sky-zone-svg,.sky-zone:focus-visible .sky-zone-svg{filter:drop-shadow(0 4px 12px rgba(0,0,0,.18)) drop-shadow(0 0 16px rgba(255,255,255,.38));transform:translateY(-1px)}\n.sky-zone:focus-visible{outline:2px solid var(--sky-white);outline-offset:6px}\n.is-drag .sky-zone-svg{filter:drop-shadow(0 4px 12px rgba(0,0,0,.18)) drop-shadow(0 0 16px rgba(255,255,255,.38));transform:translateY(-1px)}\n.is-error .sky-zone-path{stroke-dasharray:7 6}\n.is-loading .sky-zone-path{animation:sky-pulse 1.8s ease-in-out infinite}\n@keyframes sky-pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.45}}\n.sky-zone-note{margin-top:1.25rem;background:var(--sky-white);border-radius:var(--radius);padding:.875rem 1rem;font-size:.9375rem;box-shadow:var(--glow-rest)}\n.sky-zone-note b{font-weight:600}\n\n/* buttons */\n.sky-btn{\n  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;\n  min-height:2.75rem;padding:.75rem 1.375rem;\n  background:var(--sky-white);color:var(--sky-ink);\n  font-family:var(--font-body);font-weight:600;font-size:1rem;letter-spacing:-.01em;\n  border:0;border-radius:2px;cursor:pointer;\n  box-shadow:var(--glow-rest);\n  transition:color var(--dur-base) var(--ease),box-shadow var(--dur-base) var(--ease),transform var(--dur-base) var(--ease);\n}\n.sky-btn:hover{color:var(--sky-brand-text);box-shadow:var(--glow-hover);transform:translateY(-1px)}\n.sky-btn:active{color:var(--sky-brand-press);box-shadow:var(--glow-rest);transform:translateY(0)}\n.sky-btn:focus-visible{outline:2px solid var(--sky-white);outline-offset:3px}\n.sky-btn:disabled{cursor:not-allowed;color:rgba(6,36,48,.45);box-shadow:none;transform:none}\n.sky-btn-lg{font-size:1.0625rem;padding:.9375rem 1.75rem;width:100%}\n.sky-btn-quiet{background:var(--sky-fill-soft);box-shadow:none;font-size:.875rem;padding:.625rem 1rem;min-height:2.75rem}\n.sky-btn-quiet:hover{background:var(--sky-fill);box-shadow:none;color:var(--sky-brand-text)}\n\n/* cards */\n.sky-card{background:var(--sky-white);border-radius:var(--radius);padding:1.25rem;box-shadow:var(--glow-rest)}\n.sky-card-head{display:flex;flex-direction:column;gap:.25rem;padding-bottom:1rem;border-bottom:1px solid var(--sky-fill)}\n.sky-kicker{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sky-brand-text)}\n.sky-world{font-family:var(--font-body);font-weight:600;font-size:1.375rem;line-height:1.3;word-break:break-word}\n.sky-meta{font-size:.875rem;color:rgba(6,36,48,.72)}\n\n/* toggle rows */\n.sky-rows{display:flex;flex-direction:column;gap:.25rem;margin-top:.75rem}\n.sky-row{display:flex;align-items:center;justify-content:space-between;gap:1.25rem;padding:.75rem .625rem;border-radius:var(--radius);background:transparent;transition:background var(--dur-base) var(--ease)}\n.sky-row.is-changed{background:var(--sky-fill-soft)}\n.sky-row-text{display:flex;flex-direction:column;gap:.125rem;min-width:0;flex:1;order:1}\n.sky-row-label{font-weight:400;line-height:1.4}\n.sky-row-tag{font-family:var(--font-mono);font-size:.75rem;color:rgba(6,36,48,.62);word-break:break-all}\n.sky-chip{align-self:center;order:2;flex:none;font-family:var(--font-mono);font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--sky-brand-text);background:var(--sky-fill);border-radius:var(--radius);padding:.125rem .375rem}\n.sky-switch{position:relative;display:flex;align-items:center;min-height:2.75rem;padding-block:0;flex:none;order:3;cursor:pointer}\n.sky-switch input{position:absolute;opacity:0;width:2.875rem;height:2.75rem;margin:0;cursor:pointer}\n.sky-track{width:2.875rem;height:1.625rem;border-radius:2px;background:var(--sky-fill);position:relative;transition:background var(--dur-base) var(--ease);pointer-events:none}\n.sky-track::after{content:\"\";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:1px;background:var(--sky-white);box-shadow:0 1px 2px rgba(6,36,48,.28);transition:transform var(--dur-base) var(--ease)}\n.sky-switch input:checked + .sky-track{background:var(--sky-brand-text)}\n.sky-switch input:checked + .sky-track::after{transform:translateX(20px)}\n.sky-switch input:focus-visible + .sky-track{outline:2px solid var(--sky-brand-text);outline-offset:2px}\n.sky-panel-foot{display:flex;flex-direction:column;gap:.75rem;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--sky-fill)}\n.sky-count{font-size:.875rem;color:rgba(6,36,48,.72)}\n\n/* download */\n.sky-dl{display:flex;flex-direction:column;gap:.875rem}\n.sky-aftercare{font-size:.9375rem;max-width:var(--measure);margin-inline:auto}\n\n/* warnings */\n.sky-h2{font-size:1.5rem;color:var(--sky-ink)}\n.sky-warn{display:flex;flex-direction:column;gap:1.125rem;margin-top:1.25rem}\n.sky-warn li{display:flex;flex-direction:column;gap:.25rem;max-width:var(--measure);margin-inline:auto}\n.sky-warn b{font-weight:600;font-size:1.0625rem;letter-spacing:-.01em}\n.sky-rule{height:2px;width:2.5rem;background:var(--sky-white);opacity:.5}\n\n/* footer */\n.sky-foot-in{display:flex;flex-direction:column;gap:.5rem;font-size:.875rem;padding-top:1.5rem;border-top:1px solid rgba(255,255,255,.35)}\n\n/* ---------- 6. breakpoints ---------- */\n@media (min-width:480px){\n  :root{--pad-x:1.75rem}\n  .sky-h1{font-size:2.5rem}\n  .sky-zone-title{font-size:1.25rem}\n  .sky-zone-sub{font-size:.9375rem}\n  .sky-btn-lg{width:auto}\n  .sky-dl{align-items:flex-start}\n  .sky-panel-foot{flex-direction:row;align-items:center;justify-content:space-between}\n}\n@media (min-width:768px){\n  :root{--pad-x:2.5rem}\n  body{font-size:1.0625rem}\n  .sky-header{padding-block:2rem 0}\n  .sky-hero{padding-block:5rem 3rem}\n  .sky-sec{padding-block:7rem}\n  .sky-h1{font-size:3rem}\n  .sky-lede{font-size:1.125rem}\n  .sky-h2{font-size:1.75rem}\n  .sky-card{padding:1.75rem}\n  .sky-logo img{width:4.875rem;height:4.875rem}\n}\n@media (min-width:1024px){\n  .sky-h1{font-size:3.5rem}\n  .sky-hero{padding-block:6rem 3.5rem}\n  .sky-footer{padding-block:3rem 4.5rem}\n  .sky-zone-title{font-size:1.75rem}\n  .sky-zone-sub{font-size:1rem}\n}\n@media (min-width:1280px){\n  :root{--pad-x:2.5rem}\n  body{font-size:1.125rem}\n  .sky-sec{padding-block:10rem}\n  .sky-hero{padding-block:7rem 4rem}\n  .sky-deco .d2{right:-4rem}\n}\n@media (min-width:1440px){\n  :root{--col:66rem;--pad-x:3rem}\n  .sky-zone-title{font-size:2rem}\n  .sky-zone-sub{font-size:1.125rem}\n}\n\n/* ---------- 7. utilities ---------- */\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:.001ms;animation-iteration-count:1;transition-duration:.001ms}\n  .sky-btn:hover{transform:none}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"sky-page\">\n  <sc-if value=\"{{ clouds }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"sky-deco\" aria-hidden=\"true\">\n      <svg class=\"d1 sky-drift\" sc-camel-view-box=\"0 0 400 200\"><path d=\"M56 186 A34 34 0 0 1 58 120 A52 52 0 0 1 154 98 A42 42 0 0 1 232 108 A38 38 0 0 1 296 142 A30 30 0 0 1 316 186 Z\"><\u002Fpath><\u002Fsvg>\n      <svg class=\"d2 sky-drift-b\" sc-camel-view-box=\"0 0 400 200\"><path d=\"M56 186 A34 34 0 0 1 58 120 A52 52 0 0 1 154 98 A42 42 0 0 1 232 108 A38 38 0 0 1 296 142 A30 30 0 0 1 316 186 Z\"><\u002Fpath><\u002Fsvg>\n      <svg class=\"d3 sky-drift\" sc-camel-view-box=\"0 0 400 200\"><path d=\"M56 186 A34 34 0 0 1 58 120 A52 52 0 0 1 154 98 A42 42 0 0 1 232 108 A38 38 0 0 1 296 142 A30 30 0 0 1 316 186 Z\"><\u002Fpath><\u002Fsvg>\n      <svg class=\"d4 sky-drift-b\" sc-camel-view-box=\"0 0 400 200\"><path d=\"M56 186 A34 34 0 0 1 58 120 A52 52 0 0 1 154 98 A42 42 0 0 1 232 108 A38 38 0 0 1 296 142 A30 30 0 0 1 316 186 Z\"><\u002Fpath><\u002Fsvg>\n      <svg class=\"d5 sky-drift\" sc-camel-view-box=\"0 0 400 200\"><path d=\"M56 186 A34 34 0 0 1 58 120 A52 52 0 0 1 154 98 A42 42 0 0 1 232 108 A38 38 0 0 1 296 142 A30 30 0 0 1 316 186 Z\"><\u002Fpath><\u002Fsvg>\n      <svg class=\"d6 sky-drift-b\" sc-camel-view-box=\"0 0 400 200\"><path d=\"M56 186 A34 34 0 0 1 58 120 A52 52 0 0 1 154 98 A42 42 0 0 1 232 108 A38 38 0 0 1 296 142 A30 30 0 0 1 316 186 Z\"><\u002Fpath><\u002Fsvg>\n      <svg class=\"d7 sky-drift\" sc-camel-view-box=\"0 0 400 200\"><path d=\"M56 186 A34 34 0 0 1 58 120 A52 52 0 0 1 154 98 A42 42 0 0 1 232 108 A38 38 0 0 1 296 142 A30 30 0 0 1 316 186 Z\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <header class=\"sky-header\">\n    <div class=\"sky-wrap\">\n      <a class=\"sky-logo\" href=\"#\" aria-label=\"SKYBLUE home\">\n        <img src=\"650c3154-0790-4d1e-87dd-6e05409448d9\" alt=\"SKYBLUE\" width=\"44\" height=\"44\">\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main class=\"sky-main\">\n    <section class=\"sky-hero\" data-screen-label=\"Hero\">\n      <div class=\"sky-wrap\">\n        <h1 class=\"sky-h1\" data-comment-anchor=\"229baeab6f-h1\">Turn Minecraft experiments on or off<\u002Fh1>\n        <p class=\"sky-lede\">Open a saved world, switch the experimental features you want, and save a new copy. No Minecraft settings menu, no re-creating the world.<\u002Fp>\n        <p class=\"sky-privacy\" data-comment-anchor=\"27d950735f-p\"><span class=\"sky-warn-icon\" aria-hidden=\"true\"><\u002Fspan>Your world never leaves your device.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"sky-sec\" data-screen-label=\"Drop zone\" aria-labelledby=\"sky-zone-h\">\n      <div class=\"sky-wrap\">\n        <h2 class=\"vh\" id=\"sky-zone-h\">Open a world file<\u002Fh2>\n        <button type=\"button\" class=\"{{ zoneClass }}\" sc-camel-on-click=\"{{ browse }}\" sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drag-enter=\"{{ onDragOver }}\" sc-camel-on-drag-leave=\"{{ onDragLeave }}\" sc-camel-on-drop=\"{{ onDrop }}\" aria-describedby=\"sky-zone-sub\">\n          <span class=\"sky-zone-frame\">\n            <svg class=\"sky-zone-svg\" sc-camel-view-box=\"0 0 560 250\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" aria-hidden=\"true\">\n              <path class=\"sky-zone-path\" d=\"M70,240 C30,240 8,214 8,186 C8,158 28,136 55,131\n                C58,86 96,50 143,50 C172,50 197,64 212,86\n                C231,42 275,12 326,12 C391,12 445,60 452,122\n                C458,119 465,118 472,118 C517,118 553,155 553,200\n                C553,222 536,240 514,240 Z\" data-comment-anchor=\"83e21cd426-path\"><\u002Fpath>\n            <\u002Fsvg>\n            <span class=\"sky-zone-inner\">\n              <span class=\"sky-zone-title\">{{ zoneTitle }}<\u002Fspan>\n              <span class=\"sky-zone-sub\" id=\"sky-zone-sub\">{{ zoneSub }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fspan>\n        <\u002Fbutton>\n        <input class=\"vh\" type=\"file\" accept=\".mcworld,.zip,.mctemplate\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onPick }}\">\n        <p class=\"vh\" role=\"status\" aria-live=\"polite\">{{ statusMessage }}<\u002Fp>\n        <sc-if value=\"{{ hasNote }}\">\n          <p class=\"sky-zone-note\"><b>{{ noteTitle }}<\u002Fb> {{ noteBody }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ hasFile }}\">\n      <section class=\"sky-sec\" data-screen-label=\"Toggle panel\" aria-labelledby=\"sky-panel-h\">\n        <div class=\"sky-wrap\">\n          <div class=\"sky-card\">\n            <div class=\"sky-card-head\">\n              <span class=\"sky-kicker\">World loaded<\u002Fspan>\n              <h2 class=\"sky-world\" id=\"sky-panel-h\">{{ worldName }}<\u002Fh2>\n              <p class=\"sky-meta\">{{ panelMeta }}<\u002Fp>\n            <\u002Fdiv>\n            <ul class=\"sky-rows\">\n              <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"4\">\n                <li class=\"{{ row.cls }}\">\n                  <label class=\"sky-switch\">\n                    <input type=\"checkbox\" role=\"switch\" checked=\"{{ row.on }}\" sc-camel-on-change=\"{{ row.toggle }}\" aria-label=\"{{ row.label }}\">\n                    <span class=\"sky-track\"><\u002Fspan>\n                  <\u002Flabel>\n                  <span class=\"sky-row-text\">\n                    <span class=\"sky-row-label\">{{ row.label }}<\u002Fspan>\n                    <sc-if value=\"{{ rawTags }}\" hint-placeholder-val=\"{{ true }}\">\n                      <span class=\"sky-row-tag\">{{ row.tag }}<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fspan>\n                  <sc-if value=\"{{ row.changed }}\">\n                    <span class=\"sky-chip\">{{ row.chip }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n            <div class=\"sky-panel-foot\">\n              <p class=\"sky-count\">{{ changedCount }}<\u002Fp>\n              <button type=\"button\" class=\"sky-btn sky-btn-quiet\" sc-camel-on-click=\"{{ allOff }}\">Turn everything off<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section class=\"sky-sec\" data-screen-label=\"Download\" aria-labelledby=\"sky-dl-h\">\n        <div class=\"sky-wrap sky-dl\">\n          <h2 class=\"vh\" id=\"sky-dl-h\">Download<\u002Fh2>\n          <sc-if value=\"{{ canDownload }}\" hint-placeholder-val=\"{{ true }}\">\n            <button type=\"button\" class=\"sky-btn sky-btn-lg\" sc-camel-on-click=\"{{ download }}\">{{ downloadLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ verifyError }}\">\n            <p class=\"sky-zone-note\"><b>Nothing was downloaded.<\u002Fb> SKYBLUE read its own output back to check it and the result did not match your selection, so it stopped. Your original file is untouched.<\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ keeping }}\" hint-placeholder-val=\"{{ true }}\">\n            <p class=\"sky-aftercare\">Your original file is untouched. To use the new copy, open it on the device with Minecraft — on a Chromebook or phone, tap the downloaded file; on a desktop, double-click it. Minecraft imports it as a separate world, so both versions stay in your list.<\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ clearing }}\">\n            <p class=\"sky-aftercare\">Every experiment is switched off, so the new copy is written without an experiments block and without the tags that mark a world as having used experiments. Your original file is untouched. Open the downloaded file on the device with Minecraft — tap it on a Chromebook or phone, double-click it on a desktop — and it imports as a separate world.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <section class=\"sky-sec\" data-screen-label=\"Warnings\" aria-labelledby=\"sky-warn-h\">\n      <div class=\"sky-wrap\">\n        <div class=\"sky-rule\" aria-hidden=\"true\"><\u002Fdiv>\n        <h2 class=\"sky-h2\" id=\"sky-warn-h\" style=\"margin-top:1rem\">Read this first<\u002Fh2>\n        <ul class=\"sky-warn\">\n          <li><b>Back up before you change anything.<\u002Fb>Keep the original .mcworld file somewhere safe. That is your only way back if something goes wrong.<\u002Fli>\n          <li><b>Experiments mark a world permanently.<\u002Fb>Once a world has been saved with experiments enabled, Minecraft records that forever. Turning a feature back off here removes the feature, not the mark.<\u002Fli>\n          <li><b>A world can stop loading.<\u002Fb>If a world asks for a feature the installed version of Minecraft does not have, it may fail to open. Match your flags to the version you actually play on.<\u002Fli>\n          <li><b>Anything built with an experiment can break.<\u002Fb>Blocks, items, and behaviour added by a feature may disappear when that feature is switched off.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n\n  <footer class=\"sky-footer\">\n    <div class=\"sky-wrap sky-foot-in\">\n      <p>SKYBLUE runs entirely in this browser tab. Nothing is uploaded, stored, or logged.<\u002Fp>\n      <p>Built on the work of the Minecraft Bedrock community, whose NBT and level.dat documentation made editing experiment flags possible. Not affiliated with Mojang or Microsoft.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;decorativeClouds&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;showRawTags&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;compactPanel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;}}\">\nconst LABELS = {\n  data_driven_items: \"Holiday Creator Features\",\n  data_driven_biomes: \"Custom biomes\",\n  experimental_molang_features: \"Upcoming Molang features\",\n  upcoming_creator_features: \"Upcoming Creator Features\",\n  gametest: \"Beta APIs (scripting)\",\n  villager_trades_rebalance: \"Villager trade rebalancing\",\n  cameras: \"Creator cameras\",\n  experimental_creator_cameras: \"Creator cameras\",\n  jigsaw_structures: \"Jigsaw structures\",\n  short_sneaking: \"Short sneaking\",\n  recipe_unlocking: \"Recipe unlocking\",\n  deferred_technical_preview: \"Technical preview features\",\n  render_dragon_features: \"Graphics features (Render Dragon)\",\n  experiments_ever_used: null,\n  saved_with_toggled_experiments: null\n};\nconst META = [\"experiments_ever_used\", \"saved_with_toggled_experiments\"];\n\nconst CRC_TABLE = (() => {\n  const t = new Uint32Array(256);\n  for (let n = 0; n < 256; n++) {\n    let c = n;\n    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;\n    t[n] = c >>> 0;\n  }\n  return t;\n})();\nfunction crc32(b) {\n  let c = ~0;\n  for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 255] ^ (c >>> 8);\n  return (~c) >>> 0;\n}\nasync function inflateRaw(u8) {\n  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream(\"deflate-raw\"));\n  return new Uint8Array(await new Response(stream).arrayBuffer());\n}\nfunction prettify(tag) {\n  const s = tag.replace(/_/g, \" \").trim();\n  return s.charAt(0).toUpperCase() + s.slice(1);\n}\n\n/* ---- NBT (uncompressed, little-endian) ---- */\nconst T_END = 0, T_BYTE = 1, T_SHORT = 2, T_INT = 3, T_LONG = 4, T_FLOAT = 5, T_DOUBLE = 6,\n      T_BYTES = 7, T_STR = 8, T_LIST = 9, T_COMP = 10, T_INTS = 11, T_LONGS = 12;\nconst DEC = new TextDecoder(), ENC = new TextEncoder();\nconst MAX_UNPACK = 64 * 1024 * 1024;\nconst CATALOG = [\"data_driven_items\", \"data_driven_biomes\", \"experimental_molang_features\",\n  \"upcoming_creator_features\", \"gametest\", \"villager_trades_rebalance\",\n  \"experimental_creator_cameras\", \"jigsaw_structures\", \"recipe_unlocking\",\n  \"deferred_technical_preview\"];\n\nclass NbtReader {\n  constructor(bytes) { this.b = bytes; this.dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength); this.p = 0; }\n  u8() { return this.b[this.p++]; }\n  i8() { const v = this.dv.getInt8(this.p); this.p += 1; return v; }\n  i16() { const v = this.dv.getInt16(this.p, true); this.p += 2; return v; }\n  u16() { const v = this.dv.getUint16(this.p, true); this.p += 2; return v; }\n  i32() { const v = this.dv.getInt32(this.p, true); this.p += 4; return v; }\n  i64() { const v = this.dv.getBigInt64(this.p, true); this.p += 8; return v; }\n  f32() { const v = this.dv.getFloat32(this.p, true); this.p += 4; return v; }\n  f64() { const v = this.dv.getFloat64(this.p, true); this.p += 8; return v; }\n  str() { const n = this.u16(); const s = DEC.decode(this.b.subarray(this.p, this.p + n)); this.p += n; return s; }\n}\n\nfunction readPayload(r, type) {\n  switch (type) {\n    case T_BYTE: return r.i8();\n    case T_SHORT: return r.i16();\n    case T_INT: return r.i32();\n    case T_LONG: return r.i64();\n    case T_FLOAT: return r.f32();\n    case T_DOUBLE: return r.f64();\n    case T_BYTES: { const n = r.i32(); const a = r.b.slice(r.p, r.p + n); r.p += n; return a; }\n    case T_STR: return r.str();\n    case T_LIST: { const et = r.u8(); const n = r.i32(); const items = []; for (let i = 0; i < n; i++) items.push(readPayload(r, et)); return { elemType: et, items: items }; }\n    case T_COMP: { const m = new Map(); for (;;) { const t = r.u8(); if (t === T_END || t === undefined) break; const nm = r.str(); m.set(nm, { type: t, value: readPayload(r, t) }); } return m; }\n    case T_INTS: { const n = r.i32(); const a = []; for (let i = 0; i < n; i++) a.push(r.i32()); return a; }\n    case T_LONGS: { const n = r.i32(); const a = []; for (let i = 0; i < n; i++) a.push(r.i64()); return a; }\n    default: throw new Error(\"nbt\");\n  }\n}\n\nclass NbtWriter {\n  constructor() { this.b = new Uint8Array(8192); this.p = 0; }\n  need(n) { if (this.p + n <= this.b.length) return; let len = this.b.length; while (len < this.p + n) len *= 2; const nb = new Uint8Array(len); nb.set(this.b.subarray(0, this.p)); this.b = nb; }\n  view() { return new DataView(this.b.buffer); }\n  u8(v) { this.need(1); this.b[this.p++] = v & 255; }\n  i8(v) { this.need(1); this.view().setInt8(this.p, v); this.p += 1; }\n  i16(v) { this.need(2); this.view().setInt16(this.p, v, true); this.p += 2; }\n  u16(v) { this.need(2); this.view().setUint16(this.p, v, true); this.p += 2; }\n  i32(v) { this.need(4); this.view().setInt32(this.p, v, true); this.p += 4; }\n  i64(v) { this.need(8); this.view().setBigInt64(this.p, typeof v === \"bigint\" ? v : BigInt(v), true); this.p += 8; }\n  f32(v) { this.need(4); this.view().setFloat32(this.p, v, true); this.p += 4; }\n  f64(v) { this.need(8); this.view().setFloat64(this.p, v, true); this.p += 8; }\n  str(s) { const by = ENC.encode(s); this.u16(by.length); this.need(by.length); this.b.set(by, this.p); this.p += by.length; }\n  raw(a) { this.need(a.length); this.b.set(a, this.p); this.p += a.length; }\n  out() { return this.b.slice(0, this.p); }\n}\n\nfunction writePayload(w, type, value) {\n  switch (type) {\n    case T_BYTE: w.i8(value); break;\n    case T_SHORT: w.i16(value); break;\n    case T_INT: w.i32(value); break;\n    case T_LONG: w.i64(value); break;\n    case T_FLOAT: w.f32(value); break;\n    case T_DOUBLE: w.f64(value); break;\n    case T_BYTES: w.i32(value.length); w.raw(value); break;\n    case T_STR: w.str(value); break;\n    case T_LIST: w.u8(value.elemType); w.i32(value.items.length); value.items.forEach(it => writePayload(w, value.elemType, it)); break;\n    case T_COMP: value.forEach((entry, name) => { w.u8(entry.type); w.str(name); writePayload(w, entry.type, entry.value); }); w.u8(T_END); break;\n    case T_INTS: w.i32(value.length); value.forEach(v => w.i32(v)); break;\n    case T_LONGS: w.i32(value.length); value.forEach(v => w.i64(v)); break;\n    default: throw new Error(\"nbt\");\n  }\n}\n\nfunction parseLevelDat(bytes) {\n  if (bytes.length < 12) throw new Error(\"nbt\");\n  const head = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);\n  const version = head.getInt32(0, true);\n  const declared = head.getInt32(4, true);\n  const len = declared > 0 && declared <= bytes.length - 8 ? declared : bytes.length - 8;\n  const r = new NbtReader(bytes.subarray(8, 8 + len));\n  if (r.u8() !== T_COMP) throw new Error(\"nbt\");\n  const rootName = r.str();\n  return { version: version, rootName: rootName, root: { type: T_COMP, value: readPayload(r, T_COMP) } };\n}\n\nfunction buildLevelDat(doc) {\n  const w = new NbtWriter();\n  w.u8(T_COMP); w.str(doc.rootName); writePayload(w, T_COMP, doc.root.value);\n  const payload = w.out();\n  const out = new Uint8Array(8 + payload.length);\n  const dv = new DataView(out.buffer);\n  dv.setInt32(0, doc.version, true);\n  dv.setInt32(4, payload.length, true);\n  out.set(payload, 8);\n  return out;\n}\n\nfunction experimentsOf(root) {\n  const e = root.value.get(\"experiments\");\n  return e && e.type === T_COMP ? e.value : null;\n}\n\nfunction applySelection(root, rows) {\n  const map = root.value;\n  const prev = experimentsOf(root);\n  const em = prev || new Map();\n  rows.forEach(r => { if (r.on) em.set(r.tag, { type: T_BYTE, value: 1 }); else em.delete(r.tag); });\n  if (rows.some(r => r.on)) {\n    em.set(\"experiments_ever_used\", { type: T_BYTE, value: 1 });\n    em.set(\"saved_with_toggled_experiments\", { type: T_BYTE, value: 1 });\n  } else {\n    em.delete(\"experiments_ever_used\");\n    em.delete(\"saved_with_toggled_experiments\");\n  }\n  if (em.size === 0) map.delete(\"experiments\");\n  else map.set(\"experiments\", { type: T_COMP, value: em });\n}\n\nfunction verifyRoundTrip(bytes, rows) {\n  const doc = parseLevelDat(bytes);\n  const em = experimentsOf(doc.root);\n  const anyOn = rows.some(r => r.on);\n  if (!anyOn) return em === null;\n  if (!em) return false;\n  for (const r of rows) {\n    const e = em.get(r.tag);\n    if (r.on) { if (!e || e.type !== T_BYTE || e.value !== 1) return false; }\n    else if (e) return false;\n  }\n  const a = em.get(\"experiments_ever_used\"), b = em.get(\"saved_with_toggled_experiments\");\n  return !!a && a.value === 1 && !!b && b.value === 1;\n}\n\nclass Component extends DCLogic {\n  state = { status: \"empty\", drag: false, fileName: \"\", worldName: \"\", rows: [], error: \"\", busy: false, verifyError: false };\n\n  fileRef = React.createRef();\n\n  /* ---- zip ---- */\n  readZip(buf) {\n    const dv = new DataView(buf), u8 = new Uint8Array(buf);\n    let eocd = -1;\n    for (let i = buf.byteLength - 22; i >= 0 && i > buf.byteLength - 66000; i--) {\n      if (dv.getUint32(i, true) === 0x06054b50) { e ue);\n      cv.setUint16(8, 0x0800, true); cv.setUint16(10, e.method, true); cv.setUint16(12, 0, true);\n      cv.setUint16(14, 0x2100, true); cv.setUint32(16, e.crc, true); cv.setUint32(20, e.csize, true);\n      cv.setUint32(24, e.usize, true); cv.setUint16(28, nb.length, true);\n      cv.setUint32(42, offset, true); ch.set(nb, 46);\n      central.push(ch);\n      offset += lh.length + e.data.length;\n    }\n    const cdSize = central.reduce((s, c) => s + c.length, 0);\n    const end = new Uint8Array(22), ev = new DataView(end.buffer);\n    ev.setUint32(0, 0x06054b50, true);\n    ev.setUint16(8, entries.length, true); ev.setUint16(10, entries.length, true);\n    ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);\n    return new Blob([...parts, ...central, end], { type: \"application/octet-stream\" });\n  }\n\n  /* ---- flow ---- */\n  browse = () => { if (this.fileRef.current) this.fileRef.current.click(); };\n  onPick = (e) => { const f = e.target.files && e.target.files[0]; if (f) this.load(f); e.target.value = \"\"; };\n  onDragOver = (e) => { e.preventDefault(); if (!this.state.drag) this.setState({ drag: true }); };\n  onDragLeave = (e) => { e.preventDefault(); this.setState({ drag: false }); };\n  onDrop = (e) => {\n    e.preventDefault();\n    this.setState({ drag: false });\n    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];\n    if (f) this.load(f);\n  };\n\n  async load(file) {\n    this.setState({ status: \"loading\", drag: false, error: \"\", fileName: file.name, rows: [], verifyError: false });\n    try {\n      const buf = await file.arrayBuffer();\n      const entries = this.readZip(buf);\n      const levelEntry = entries.find(e => e.name.replace(/^.*\\//, \"\") === \"level.dat\");\n      if (!levelEntry) throw new Error(\"no-level\");\n      if (levelEntry.usize > MAX_UNPACK) throw new Error(\"too-big\");\n      const level = levelEntry.method === 8 ? await inflateRaw(levelEntry.data) : new Uint8Array(leve is.level);\n      applySelection(doc.root, this.state.rows);\n      const level = buildLevelDat(doc);\n\n      if (!verifyRoundTrip(level, this.state.rows)) {\n        this.setState({ verifyError: true });\n        return;\n      }\n\n      const out = this.zip.map(e => e === this.levelEntry\n        ? { name: e.name, method: 0, crc: crc32(level), csize: level.length, usize: level.length, data: level }\n        : e);\n      const blob = this.buildZip(out);\n      const base = (this.state.fileName || \"world\").replace(/\\.(mcworld|mctemplate|zip)$/i, \"\");\n      const a = document.createElement(\"a\");\n      a.href = URL.createObjectURL(blob);\n      a.download = base + \"-skyblue.mcworld\";\n      document.body.appendChild(a);\n      a.click();\n      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);\n      this.setState({ verifyError: false });\n    } catch (err) {\n      this.setState({ verifyError: true });\n    } finally {\n      this.setState({ busy: false });\n    }\n  };\n\n  errorText(code) {\n    if (code === \"not-zip\") return \"That file is not a Minecraft world export. Look for a file ending in .mcworld.\";\n    if (code === \"no-level\") return \"No level.dat inside this file, so there is nothing to change. It may be a resource pack or add-on.\";\n    if (code === \"too-big\") return \"The world data inside this file is unexpectedly large (over 64 MB), so SKYBLUE stopped instead of unpacking it.\";\n    if (code === \"nbt\") return \"SKYBLUE could not read the world data in this file. It may come from a much newer or older version of Minecraft.\";\n    return \"This file could not be read. If it came from a cloud drive, download it fully and try again.\";\n  }\n\n  renderVals() {\n    const s = this.state;\n    const clouds = this.props.decorativeClouds ?? true;\n    const rawTags = this.props.showRawTags ?? true;\n    const compact = this.props.compactPanel ?? false;\n\n    const changed = s.rows.filter(r => r.on !== r.original);\n    const on = s.rows.filter(r => r.on).length;\n\n    let zoneClass = \"sky-zone\";\n    if (s.drag) zoneClass += \" is-drag\";\n    if (s.status === \"loading\") zoneClass += \" is-loading\";\n    if (s.status === \"error\") zoneClass += \" is-error\";\n\n    let zoneTitle = \"Drop your .mcworld here\";\n    let zoneSub = \"or tap to browse. Stays on this device.\";\n    if (s.drag) { zoneTitle = \"Let go to open\"; zoneSub = \"One world file at a time.\"; }\n    else if (s.status === \"loading\") { zoneTitle = \"Reading your world\"; zoneSub = \"One moment.\"; }\n    else if (s.status === \"loaded\") { zoneTitle = \"World open\"; zoneSub = \"Drop another file to start over.\"; }\n    else if (s.status === \"error\") { zoneTitle = \"Could not open that\"; zoneSub = \"Tap to try another file.\"; }\n\n    return {\n      clouds, rawTags,\n      zoneClass, zoneTitle, zoneSub,\n      fileRef: this.fileRef,\n      browse: this.browse, onPick: this.onPick,\n      onDragOver: this.onDragOver, onDragLeave: this.onDragLeave, onDrop: this.onDrop,\n      statusMessage: s.status === \"loaded\" ? \"World \" + s.worldName + \" loaded with \" + s.rows.length + \" experiments.\" : s.status === \"error\" ? this.errorText(s.error) : s.status === \"loading\" ? \"Reading world file.\" : \"No file chosen.\",\n      hasNote: s.status === \"error\",\n      noteTitle: \"Nothing changed.\",\n      noteBody: this.errorText(s.error),\n      hasFile: s.status === \"loaded\",\n      worldName: s.worldName.length > 64 ? s.worldName.slice(0, 64) + \"…\" : s.worldName,\n      panelMeta: s.rows.length + \" experiments in this world · \" + on + \" currently on\",\n      rows: s.rows.map(r => ({\n        tag: r.tag,\n        label: r.label,\n        on: r.on,\n        changed: r.on !== r.original,\n        chip: r.on ? \"turned on\" : \"turned off\",\n        cls: \"sky-row\" + (r.on !== r.original ? \" is-changed\" : \"\") + (compact ? \" is-compact\" : \"\"),\n        toggle: () => this.toggle(r.tag)\n      })),\n      changedCount: changed.length === 0 ? \"Nothing changed yet.\" : changed.length === 1 ? \"1 change since this world was opened.\" : changed.length + \" changes since this world was opened.\",\n      allOff: this.allOff,\n      download: this.download,\n      clearing: on === 0,\n      keeping: on > 0,\n      verifyError: s.verifyError,\n      canDownload: !s.verifyError,\n      downloadLabel: s.busy ? \"Preparing file…\" : on === 0 ? \"Remove all experiments\" : \"Download modified world\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
